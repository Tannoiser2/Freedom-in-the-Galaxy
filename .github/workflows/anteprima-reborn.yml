name: Pubblica anteprima Reborn

on:
  workflow_dispatch:
  push:
    branches: [codex/reborn-preview]

permissions:
  contents: read

concurrency:
  group: reborn-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: reborn-preview
      url: https://reborn-freedom-in-the-galaxy.ludoteca-digitale.com/
    steps:
      - uses: actions/checkout@v4
      - name: Prepara il sito di anteprima
        run: python3 tools/prepare_reborn_preview.py
      - name: Conserva il sito come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: anteprima-reborn
          path: build/reborn-preview
      - name: Pubblica sulla ludoteca privata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LUDOTECA_DOMINIO: ludoteca-digitale.com
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Mancano i segreti Cloudflare del repository; anteprima non pubblicata.'
            exit 1
          fi
          python3 tools/pubblica_cloudflare.py build/reborn-preview freedom-in-the-galaxy-reborn reborn-freedom-in-the-galaxy

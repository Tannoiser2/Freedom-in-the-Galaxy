# Costruisce la versione web del gioco con Godot e la pubblica sulla ludoteca privata (Cloudflare) e,
# finché il repository è pubblico, anche su GitHub Pages.
# Non parte da sola a ogni modifica: si avvia quando si vuole pubblicare, con Actions → Pubblica → Run workflow,
# oppure con un commit sul ramo main il cui messaggio contiene [pubblica].
name: Pubblica

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pubblica]') }}
    runs-on: ubuntu-latest
    outputs:
      preview_sha256: ${{ steps.reborn.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Scarica Godot 4.7 e il modello di esportazione web
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          T=~/.local/share/godot/export_templates/4.7.stable
          mkdir -p $T
          unzip -q -j Godot_v4.7-stable_export_templates.tpz templates/web_nothreads_release.zip -d $T
          cp $T/web_nothreads_release.zip $T/web_nothreads_debug.zip

      - name: Esporta la versione web
        run: |
          mkdir -p build/web
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --import || true
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.pck
          touch build/web/.nojekyll

      - name: Aggiungi l'anteprima Reborn al sito
        id: reborn
        run: |
          python3 tools/prepare_reborn_preview.py
          mkdir -p build/web/reborn
          cp -R build/reborn-preview/. build/web/reborn/
          python3 -c 'import json; print("sha256=" + json.load(open("build/reborn-preview/version.json"))["viewer_sha256"])' >> "$GITHUB_OUTPUT"

      # Ludoteca privata: con i segreti CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID pubblica il gioco su
      # https://freedom-in-the-galaxy.<dominio>/ protetto da email e codice. Senza segreti non fa nulla.
      - name: Pubblica su Cloudflare (ludoteca privata)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LUDOTECA_DOMINIO: ludoteca-digitale.com
        run: python3 tools/pubblica_cloudflare.py build/web freedom-in-the-galaxy freedom-in-the-galaxy

      # GitHub Pages solo finché il repository è pubblico
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.repository.private }}
        with:
          path: build/web

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verifica l'anteprima pubblicata
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA256: ${{ needs.build.outputs.preview_sha256 }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = os.environ['PAGE_URL'].rstrip('/') + '/reborn/'
          expected = os.environ['EXPECTED_SHA256']
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(base + 'version.json', timeout=20) as response:
                      version = json.load(response)
                  assert version['standalone'] and version['render_count'] == 6
                  assert version['viewer_sha256'] == expected
                  assert version['atlas_planets'] == 51 and version['atlas_systems'] == 25
                  assert version['atlas_material_variants'] == 18
                  with urllib.request.urlopen(base, timeout=20) as response:
                      assert 'Atlante interattivo della galassia' in response.read().decode()
                  with urllib.request.urlopen(base + 'atlante/' + version['atlas_data'], timeout=20) as response:
                      atlas = json.load(response)
                  assert len(atlas['planets']) == 51 and len(atlas['systems']) == 25
                  assert len(atlas['materials']) == 6 and all(len(v) == 3 for v in atlas['materials'].values())
                  assert all('material' in e for p in atlas['planets'] for e in p['ambienti'])
                  print('Anteprima verificata su ' + base)
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                      summary.write('## Anteprima Reborn pubblicata\n\n' + base + '\n')
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(10)
          PY
